services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: sgaiti-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sgaiti_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sgaiti_db}
      MYSQL_USER: ${MYSQL_USER:-sgaiti_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sgaiti_pass_change_me}
    ports:
      - "${MYSQL_HOST_PORT:-53107}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sgaiti-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sgaiti-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-sgaiti_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-sgaiti_pass_change_me}
      UPLOAD_LIMIT: 100M
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sgaiti-network

  # Laravel + Inertia Application
  sgaiti:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sgaiti-app
    restart: always
    ports:
      - "${APP_HOST_PORT:-5050}:5050"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_DATABASE:-sgaiti_db}
      - DB_USERNAME=${MYSQL_USER:-sgaiti_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-sgaiti_pass_change_me}
    networks:
      - sgaiti-network

volumes:
  mysql_data:
  storage_data:

networks:
  sgaiti-network:
    driver: bridge
